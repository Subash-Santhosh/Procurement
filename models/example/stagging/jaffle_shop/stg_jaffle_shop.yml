version : 2

models:
  - name : stg_jaffle_shop__customers
    description : "This is a staging model for customers"
    columns:
      - name : CUSTOMER_ID
        description : "The unique identifier for a customer"
        data_tests : 
          - unique
          - not_null
          
  - name : stg_jaffle_shop__orders
    description : "This is a staging model for orders"
    columns:
      - name : ORDER_ID
        description : "The unique identifier for an order"
        data_tests : 
          - unique
          - not_null

      - name : STATUS
        description: "{{ docs('STATUS') }}"
        data_tests :
          - accepted_values:
            values: ['completed', 'returned', 'placed']